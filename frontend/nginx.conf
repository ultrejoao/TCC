server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O upload de sinal bruto pode chegar a dezenas de MB; o padrao do nginx
    # (1 MB) rejeitaria antes de a aplicacao ver a requisicao, devolvendo um
    # 413 do proprio nginx em vez do erro padronizado da API.
    client_max_body_size 64m;

    # Cabecalhos de seguranca. A API tambem os envia; aqui protegem os arquivos
    # estaticos servidos diretamente pelo nginx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API na mesma origem: sem isso os cookies httpOnly seriam third-party.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # a API usa este cabecalho para registrar o IP na trilha de auditoria
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a inferencia sincrona leva alguns segundos em sinais longos
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Acima do limite do nginx a requisicao nem chega a aplicacao, e a resposta
    # padrao seria uma pagina HTML — quebrando o formato de erro que o resto da
    # API mantem. Aqui o 413 sai no mesmo formato RFC 7807.
    error_page 413 = @limite_upload;
    location @limite_upload {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Conteudo grande demais","status":413,"detail":"O arquivo excede o limite aceito pelo servidor.","instance":"/api/v1/measurements"}';
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Os arquivos com hash no nome podem ser cacheados indefinidamente; o
    # index.html nao, senao o navegador serviria uma versao velha da interface
    # apontando para bundles que ja nao existem.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
