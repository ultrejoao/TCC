# Sistema completo: banco, API com a camada de ML, e interface servida por nginx.
#
#   docker compose up -d --build
#   -> interface em http://localhost:8080
#
# O primeiro ADMIN nao e criado automaticamente, de proposito: um usuario com
# senha padrao embutida na imagem seria uma porta aberta. Crie-o uma vez com
#   docker compose exec api python scripts/seed_admin.py --email voce@empresa.com --name "Seu Nome"

services:
  db:
    image: postgres:16-alpine
    container_name: tcc_motores_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-tcc_motores}
    # Publicado apenas em 127.0.0.1: acessivel para migrations e inspecao na
    # maquina de desenvolvimento, inalcancavel pela rede. Em producao, remova
    # este bloco — quem precisa do banco e a API, pela rede interna.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcc} -d ${POSTGRES_DB:-tcc_motores}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tcc_motores_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-tcc_motores}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Interface e API na mesma origem (nginx), entao o CORS so precisa
      # cobrir o endereco pelo qual o navegador acessa a aplicacao.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # true apenas atras de HTTPS: com secure=true em HTTP o navegador
      # descarta o cookie e o login nunca completa.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      # Os sinais enviados pelos tecnicos sobrevivem a recriacao do container.
      - uploads:/app/backend/uploads
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tcc_motores_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  uploads:
